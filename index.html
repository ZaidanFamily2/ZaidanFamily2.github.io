<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaidan Family</title>
  <meta name="description" content="Zaidan Family - Official Link">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{
      min-height:100vh;
      color:#fff;
      background:
        radial-gradient(circle at 20% 15%, rgba(0,119,255,.35) 0 2px, transparent 3px),
        radial-gradient(circle at 75% 25%, rgba(255,60,60,.30) 0 1.5px, transparent 3px),
        radial-gradient(circle at 40% 75%, rgba(255,255,255,.25) 0 1px, transparent 3px),
        radial-gradient(circle at 85% 80%, rgba(0,150,255,.25) 0 2px, transparent 4px),
        linear-gradient(145deg,#02030a 0%,#071a45 45%,#12030a 100%);
      background-size:auto,auto,auto,auto,cover;
      overflow-x:hidden;
    }
    body:before{
      content:"";
      position:fixed;inset:0;pointer-events:none;opacity:.7;
      background-image:
        radial-gradient(#fff 1px,transparent 1px),
        radial-gradient(#4aa8ff 1px,transparent 1px);
      background-size:85px 85px,125px 125px;
      background-position:10px 20px,50px 70px;
    }
    .wrap{width:min(92%,430px);margin:0 auto;padding:38px 0 30px;position:relative}
    .card{
      padding:28px 20px 24px;border:1px solid rgba(90,170,255,.35);
      border-radius:28px;background:rgba(2,7,20,.72);
      backdrop-filter:blur(12px);
      box-shadow:0 0 45px rgba(0,110,255,.22),0 0 70px rgba(255,0,45,.08);
      text-align:center;
    }
    .logo{
      width:155px;height:155px;object-fit:cover;border-radius:50%;
      border:4px solid #54b7ff;
      box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 35px rgba(0,145,255,.75);
      margin-bottom:17px;
    }
    h1{margin:0;font-size:32px;letter-spacing:.5px;text-shadow:0 0 18px #168bff}
    .sub{margin:8px 0 24px;color:#c9dcff;font-size:14px}
    .link{
      display:block;text-decoration:none;color:#fff;font-weight:700;
      margin:13px 0;padding:16px 18px;border-radius:16px;
      background:linear-gradient(100deg,rgba(0,89,190,.9),rgba(25,25,45,.95));
      border:1px solid rgba(100,190,255,.55);
      box-shadow:0 7px 22px rgba(0,0,0,.35),0 0 18px rgba(0,105,255,.16);
      transition:.2s;
    }
    .link:hover{transform:translateY(-2px);box-shadow:0 9px 26px rgba(0,0,0,.45),0 0 25px rgba(0,125,255,.32)}
    .tg{background:linear-gradient(100deg,#087dc1,#102d62)}
    .rocket{font-size:22px;margin-right:7px}
    footer{margin-top:22px;color:#7f9bc4;font-size:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <img class="logo" src="logo.jpg" alt="Zaidan Family">
      <h1>Zaidan Family</h1>
      <div class="sub">Welcome to the official Zaidan Family page 🚀</div>

      <a class="link tg" href="https://t.me/ZaidanFamily" target="_blank" rel="noopener noreferrer">
        <span class="rocket">🚀</span> Telegram Zaidan Family
      </a>

      <footer>© Zaidan Family</footer>
    </section>
  </main>
</body>
</html>
